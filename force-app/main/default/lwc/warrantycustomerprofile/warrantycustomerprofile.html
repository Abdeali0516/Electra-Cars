<template>
    <div class="wcp-shell">

        <template if:true={hasProfile}>

            <!-- Header banner: vehicle name + color + status pill -->
            <div class={bannerClass}>
                <span class="wcp-vehicle-name">{colorAndModel}</span>
                <span class={pillClass}>{statusLabel}</span>
            </div>

            <!-- Info rows: owner, dealer, odometer -->
            <div class="wcp-body">
                <div class="wcp-info-row">
                    <span class="wcp-icon">&#128100;</span>
                    <span>{ownerName}</span>
                </div>
                <div class="wcp-info-row">
                    <span class="wcp-icon">&#128205;</span>
                    <span>Sold via: {dealerName}</span>
                </div>
                <div class="wcp-info-row">
                    <span class="wcp-icon">&#128290;</span>
                    <span>Current odometer: {mileageDisplay}</span>
                </div>
            </div>

            <!-- Active warranty type list -->
            <template if:true={hasWarranties}>
                <div class="wcp-warranties">
                    <p class="wcp-warranties-label">Active Warranties:</p>
                    <template for:each={warranties} for:item="w">
                        <div key={w.key} class="wcp-warranty-row">
                            <span class="wcp-check">&#9989;</span>
                            <span class="wcp-warranty-detail">
                                <strong>{w.warrantyType}</strong>
                                &mdash; valid till {w.endDateFormatted}
                                <template if:true={w.mileageDisplay}>
                                    <span class="wcp-mileage">({w.mileageDisplay})</span>
                                </template>
                            </span>
                        </div>
                    </template>
                </div>
            </template>

            <!-- Draft claim link -->
            <template if:true={hasClaimId}>
                <div class="wcp-claim-row">
                    <span class="wcp-claim-link" onclick={openClaim}>View Draft Claim &#8599;</span>
                </div>
            </template>

        </template>

        <template if:false={hasProfile}>
            <div class="wcp-empty">No vehicle profile available.</div>
        </template>

    </div>
</template>
